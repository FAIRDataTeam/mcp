# Build/test CI for fdp-mcp: lint + types + tests, then build the Docker image
# and push it to GHCR on pushes to main. Complements security-scan.yml
# (dependency audit + SBOM). Mirrors the server repo's quality gate.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --extra dev: ruff/pytest/pyright live in [project.optional-dependencies]
      # dev, which a plain `uv sync` does not install.
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pyright

  test:
    name: pytest (unit + conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      # Unit + conformance are fast and need no services; the in-process
      # integration suite drives the server with the FDP mocked (respx), so it
      # needs no container either. The live-FDP integration test skips unless
      # FDP_MCP_IT_BASE_URL is set (see tests/integration/test_live_fdp.py).
      - run: uv run pytest tests/unit tests/conformance tests/integration

  image:
    name: build + push image
    # Publish only when lint + tests are green; pyright runs in parallel and is
    # visible on the PR without blocking the image.
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fdp-mcp
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build (push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
