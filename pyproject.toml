[project]
name = "fdp-mcp"
version = "0.2.0"
description = "MCP sidecar exposing the metadata of any spec-compliant FAIR Data Point to AI agents through a read-only tool surface."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [
  { name = "FDP Contributors" },
]
keywords = ["fair", "fdp", "mcp", "metadata", "rdf", "dcat", "shacl", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  # MCP protocol — official Python SDK, streamable-HTTP + stdio transports
  # (ADR-0018 §2). It pulls in starlette/uvicorn/anyio transitively; we pin the
  # security-relevant transitives explicitly below so the pip-audit gate stays
  # green regardless of the SDK's own floors.
  "mcp>=1.9",

  # HTTP client for the FDP public surface (ADR-0018 §1). Async; the whole
  # bridge is I/O-bound glue over content-negotiated GET, /sparql, and search.
  "httpx>=0.27",

  # RDF handling.
  # Keep rdflib >= 7: it neutralizes RDF/XML external-entity (XXE) expansion that
  # earlier versions allowed on untrusted parse input (mirrors the server floor).
  "rdflib>=7.0",

  # Config
  "pydantic>=2.7",
  "pydantic-settings>=2.14.2",  # floor clears GHSA-4xgf-cpjx-pc3j (pip-audit gate)

  # ASGI stack for the streamable-HTTP transport. Transitive via `mcp`, but
  # floored here for the security-scan gate:
  #   starlette 1.3.1 — CVE-2026-54282, CVE-2026-54283
  # (matches the server repo's floor; keep until `mcp` itself requires a safe
  # version.)
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.30",

  # Observability. Structured logging with credential redaction is a hard
  # requirement (ADR-0018 §3 — never log the forwarded bearer token).
  "structlog>=24.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "respx>=0.21",  # httpx mocking for the FDP client-layer unit tests
  "testcontainers>=4.8",  # live FDPneo container for the integration suite
  "jsonschema>=4.23",  # validate tool results against the tool-surface schemas
]

[project.scripts]
fdp-mcp = "fdp_mcp.server:main"

[project.urls]
Homepage = "https://github.com/FAIRDataTeam/mcp"
Documentation = "https://specs.fairdatapoint.org"
Repository = "https://github.com/FAIRDataTeam/mcp"
Issues = "https://github.com/FAIRDataTeam/mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdp_mcp"]

# ----------------------------------------------------------------------------
# Ruff — lint and format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "ASYNC",
  "PTH",  # use pathlib
  "TID",  # tidy imports
  "ARG",  # unused arguments
]
ignore = [
  "E501",   # line length — handled by formatter
  "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["fdp_mcp"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------------
# Pyright — type checking
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
# Unit tests legitimately reach into a module's internals to exercise them;
# there is no cross-module private access in src, so this is test-ergonomics
# only, not a loosening of the production type contract (mirrors the server).
reportPrivateUsage = false

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--showlocals",
]
markers = [
  "unit: fast tests with no I/O (respx-mocked FDP)",
  "integration: tests that spin up a live FDP container (testcontainers)",
  "conformance: results validated against docs/mcp-tool-surface.md",
  "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  # rdflib's JSON-LD parser still constructs ConjunctiveGraph internally.
  "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/fdp_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]
show_missing = true
skip_covered = false
